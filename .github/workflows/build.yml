name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ZapTV.apk
          cp ZapTV.apk tv.apk
          cp updater/build/outputs/apk/release/updater-release.apk updater.apk
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "{\"versionCode\": $CODE, \"versionName\": \"$NAME\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: ZapTV-apk
          path: |
            ZapTV.apk
            updater.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZapTV build ${{ github.run_number }}
          files: |
            ZapTV.apk
            tv.apk
            updater.apk
            version.json
          make_latest: true
