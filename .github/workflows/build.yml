name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Test branch "tablet": one project, two builds.
# Builds the TV build (to prove it still compiles; not published) and the new tablet build.
# Publishes ONLY the tablet APK, as a pre-release and on its own "dist-tablet" branch.
# It never touches the "dist" branch or the "latest" release that the ZapTV Updater uses.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build TV and tablet
        run: gradle :app:assembleTvRelease :app:assembleTabletRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/tablet/release/app-tablet-release.apk ZapTV-Tablet.apk
          cp app/build/outputs/apk/tv/release/app-tv-release.apk ZapTV-TV-check.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZapTV-tablet-and-tv-check
          path: |
            ZapTV-Tablet.apk
            ZapTV-TV-check.apk

      - name: Publish tablet APK to dist-tablet branch (fixed download link)
        run: |
          mkdir -p dist-tablet
          cp ZapTV-Tablet.apk dist-tablet/ZapTV-Tablet.apk
          cd dist-tablet
          git init -q
          git checkout -q -b dist-tablet
          git config user.email "zaptv@users.noreply.github.com"
          git config user.name "ZapTV build"
          git add -A
          git commit -qm "tablet build ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist-tablet

      - name: Publish tablet test pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tablet-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ZapTV Tablet test ${{ github.run_number }}
          body: Touch version of ZapTV for Android tablets (test). Installs as its own app; the TV app is not affected.
          files: ZapTV-Tablet.apk
          prerelease: true
          make_latest: false
