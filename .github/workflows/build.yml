name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      # Test branch: builds ONLY the separate "ZapTV TR" test app as a pre-release.
      # It never touches the dist branch or the "latest" release the Updater uses.
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ZapTV-TR.apk

      - name: Publish test pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tr-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ZapTV TR test ${{ github.run_number }}
          body: Test build with the Turkey connection. Installs next to ZapTV as "ZapTV TR". Install it with the ZapTV Updater's upload page.
          files: ZapTV-TR.apk
          prerelease: true
          make_latest: false
